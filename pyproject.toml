[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "superaris"
version = "0.1.0"
description = "Your personal research agent with ARIS, powered by a team of agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Yang Ruofeng"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
superaris = "superaris.cli:main"

[project.urls]
Repository = "https://github.com/wanshuiyin/SuperARIS"
Issues = "https://github.com/wanshuiyin/SuperARIS/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["superaris*"]
namespaces = true

[tool.setuptools.package-data]
superaris = ["resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
